<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Member Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tagesschrift&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>

</head>

<body>

    <section id="section-page">

        <div id="container-main">
            <div id="container-cards">
                <div id="container-cards-title">
                    <h1>Team Members</h1>
                </div>
                <div id="cards">
                    <div class="first-card customized-card">
                        <img  class="avatar" src="./assets/Avatar-1.gif" alt="Owner's Avatar" height="160px"/>
                        <p class="name">customprojects</p>
                        <h2 class="title C-Title">Creator</h2>
                    </div>
                    <div class="first-card customized-card">
                        <img  class="avatar" src="./assets/Avatar-1.gif" alt="Head Admin's Avatar" height="160px"/>
                        <p class="name">customprojects</p>
                        <h2 class="title HA-Title">Head Admin</h2>
                    </div>
                    <div class="first-card customized-card">
                        <img  class="avatar" src="./assets/Avatar-1.gif" alt="Admin's Avatar" height="160px"/>
                        <p class="name">customprojects</p>
                        <h2 class="title A-Title">Admin</h2>
                    </div>
                    <div class="first-card customized-card">
                        <img  class="avatar" src="./assets/Avatar-1.gif" alt="Senior Mod's Avatar" height="160px"/>
                        <p class="name">customprojects</p>
                        <h2 class="title SM-title">Sr.Mod</h2>
                    </div>
                </div>
            </div>
        </div>

    </section>

</body>

</html>
